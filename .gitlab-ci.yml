cache:
  paths:
    - vendor/

#----------------------------
# stages
#----------------------------

stages:
  - web_presence
  - upload_publish

#----------------------------
# templates
#----------------------------

# Linux base template
#
# Uses a docker image where conda is already installed.
# Creates a album environment.
#
.linux_base_template:
  image: ubuntu:latest
  before_script:
    # install or update openssh, git + tools
    - apt-get update -y && apt-get install -yqqf openssh-client git unzip sshpass rsync bzip2 curl --fix-missing
    - 'which ssh-agent || ( apt-get update -y && apt-get install openssh-client git -y )'
    # check if ssh agent is running
    - eval $(ssh-agent -s)
    # install private deploy key from file
    - cat $SSH_PRIVATE_KEY_FILE | tr -d '\r' | ssh-add - > /dev/null

    # prepare .ssh folder
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh

    # add gitlab.com to known hosts
    - ssh-keyscan gitlab.com >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts

    # setup micromamba & album
    - mkdir -p $CI_PROJECT_DIR/bin
    - curl -Ls https://micro.mamba.pm/api/micromamba/linux-64/latest | tar -xj -C $CI_PROJECT_DIR/bin bin/micromamba --strip-components=1 bin/micromamba
    - export MICROMAMBA_EXECUTABLE=$CI_PROJECT_DIR/bin/micromamba
    - $MICROMAMBA_EXECUTABLE --version
    - eval "$($MICROMAMBA_EXECUTABLE shell hook -s bash)"
    - micromamba create -y -n album -c conda-forge python=3.13 
    - source ~/.bashrc
    - micromamba activate album
    - python -V 
    - which python
  variables:
    PIP_CACHE_DIR: $CI_PROJECT_DIR/.cache/pip
    CONDA_ENV_NAME: album
    CONDA_PREFIX: /opt/conda
    PREFIX: $CONDA_PREFIX/envs/$CONDA_ENV_NAME
  cache:
    key: one-key-to-rule-them-all-linux
    paths:
      - ${CONDA_PREFIX}/pkgs/*.tar.bz2
      - ${CONDA_PREFIX}/pkgs/urls.txt

#----------------------------
# jobs
#----------------------------


pages:
  image: node:23
  stage: web_presence
  # This folder is cached between builds
  # https://docs.gitlab.com/ce/ci/yaml/README.html#cache
  cache:
    paths:
      - gatsby/node_modules/
      # Enables git-lab CI caching. Both .cache and public must be cached, otherwise builds will fail.
      - gatsby/.cache/
      - public/
  script:
    - rm -f -R public
    - cd gatsby
    - npm install
    - ./node_modules/.bin/gatsby build --prefix-paths
  artifacts:
    paths:
      - public
  only:
    - main

upload:
  extends: .linux_base_template
  stage: upload_publish
  script:
    - album-catalog-admin upload $CI_PROJECT_NAME /opt/catalog $CI_PROJECT_URL --branch-name=$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME --force-retrieve=True --report-file=/opt/catalog/report.yml
    # create environment variables from report
    - awk '{print $0}' /opt/catalog/report.yml | sed -e 's/:[^:\/\/]/=/g;s/$//g;s/ *=/=/g' > variables.env
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "*.db"
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "solutions/**/*"
  artifacts:
    reports:
      dotenv: variables.env

publish:
  extends: .linux_base_template
  stage: upload_publish
  needs:
    - job: upload
      artifacts: true
  script:
    # using environment variables from upload job
    - echo "publishing doi $DOI of zenodo deposit with id %DEPOSIT_ID"
    # prepare repository to push changes
    - album-catalog-admin configure-repo $CI_PROJECT_NAME /opt/catalog $CI_PROJECT_URL --ci-user-name=gitlab-ci --ci-user-email=gitlab-ci@catal.og --force-retrieve=True
    - album-catalog-admin configure-ssh $CI_PROJECT_NAME /opt/catalog  $CI_PROJECT_URL
    # update the index file of the catalog
    - album-catalog-admin update $CI_PROJECT_NAME /opt/catalog $CI_PROJECT_URL  --branch-name=$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME --doi=$DOI --deposit-id=$DEPOSIT_ID
    # commit changes
    - album-catalog-admin commit $CI_PROJECT_NAME /opt/catalog $CI_PROJECT_URL  --branch-name=$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME
    # publish the deposit
    - album-catalog-admin publish $CI_PROJECT_NAME /opt/catalog $CI_PROJECT_URL --branch-name=$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME
    # merge the results to main
    - album-catalog-admin merge $CI_PROJECT_NAME /opt/catalog $CI_PROJECT_URL --branch-name $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME --ci-user-name gitlab-ci --ci-user-email gitlab-ci@catal.og --push-option merge_request.merge_when_pipeline_succeeds --log DEBUG
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "*.db"
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "solutions/**/*"
      when: manual

merge:
  image: bash
  stage: upload_publish
  script:
    - echo "Auto merge enabled! Success!"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "*.db"
      when: always
