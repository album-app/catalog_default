stages:
  - web_presence
  - upload_publish


cache:
  paths:
    - vendor/

#----------------------------
# Authentication
#----------------------------
# Uses a Project Access Token (Maintainer role, write_repository scope).
# Create one at: Settings → Access Tokens → Add new token.
# Store the token value as CI/CD variable CI_AUTH_TOKEN.
#
# CI_USER_NAME / CI_USER_EMAIL are only for git commit authorship — not authentication.
# Set them in CI/CD variables if you want a different author shown in commits other than specified here.

#----------------------------
# stages
#----------------------------

.linux_base_template:
  image: ubuntu:latest
  before_script:
    # install or update openssh, git + tools
    - apt-get update -y && apt-get install -yqqf openssh-client git unzip sshpass rsync bzip2 curl --fix-missing

    # setup micromamba & album
    - mkdir -p $CI_PROJECT_DIR/bin
    - curl -Ls https://micro.mamba.pm/api/micromamba/linux-64/latest | tar -xvj -C $CI_PROJECT_DIR/bin/ --strip-components=1 bin/micromamba
    - export MICROMAMBA_EXECUTABLE=$CI_PROJECT_DIR/bin/micromamba
    - $MICROMAMBA_EXECUTABLE --version
    - eval "$($MICROMAMBA_EXECUTABLE shell hook -s bash)"
    - micromamba create -y -n album -c conda-forge python=3.13
    - source ~/.bashrc
    - micromamba activate album
    - python -V
    - which python
    - pip install git+https://gitlab.com/album-app/album.git@dev

    # build auth URL using Project Access Token (Maintainer role)
    - AUTH_URL="${CI_PROJECT_URL/https:\/\//https://${CI_USER_NAME}:${CI_AUTH_TOKEN}@}"
  variables:
    PIP_CACHE_DIR: $CI_PROJECT_DIR/.cache/pip
    CONDA_ENV_NAME: album
    CONDA_PREFIX: /opt/conda
    PREFIX: $CONDA_PREFIX/envs/$CONDA_ENV_NAME
    # git commit authorship (not authentication — override in CI/CD settings if needed)
    CI_USER_NAME: "Album CI Bot"
    CI_USER_EMAIL: "ci@album.solutions"
  cache:
    key: one-key-to-rule-them-all-linux
    paths:
      - ${CONDA_PREFIX}/pkgs/*.tar.bz2
      - ${CONDA_PREFIX}/pkgs/urls.txt


# Builds the catalog website (GitLab Pages) from the index on every push to main.
pages:
  image: node:23
  stage: web_presence
  # This folder is cached between builds
  # https://docs.gitlab.com/ce/ci/yaml/README.html#cache
  cache:
    paths:
      - gatsby/node_modules/
      # Enables git-lab CI caching. Both .cache and public must be cached, otherwise builds will fail.
      - gatsby/.cache/
      - public/
  script:
    - rm -f -R public
    - cd gatsby
    - npm install
    - ./node_modules/.bin/gatsby build --prefix-paths
  artifacts:
    paths:
      - public
  only:
    - main


upload:
  extends: .linux_base_template
  stage: upload_publish
  script:
    - album-catalog-admin upload $CI_PROJECT_NAME /opt/catalog $AUTH_URL --branch-name=$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME --force-retrieve --report-file=/opt/catalog/report.yml
    # create environment variables from report
    - awk '{print $0}' /opt/catalog/report.yml | sed -e 's/:[^:\/\/]/=/g;s/$//g;s/ *=/=/g' > variables.env
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "*.db"
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "solutions/**/*"
  artifacts:
    reports:
      dotenv: variables.env

publish:
  extends: .linux_base_template
  stage: upload_publish
  needs:
    - job: upload
      artifacts: true
  script:
    # using environment variables from upload job
    - echo "publishing doi $DOI of zenodo deposit with id $DEPOSIT_ID"
    # prepare repository to push changes
    - album-catalog-admin configure-repo $CI_PROJECT_NAME /opt/catalog $AUTH_URL --force-retrieve
    # update the index file of the catalog
    - album-catalog-admin update $CI_PROJECT_NAME /opt/catalog $AUTH_URL  --branch-name=$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME --doi=$DOI --deposit-id=$DEPOSIT_ID
    # commit changes
    - album-catalog-admin commit $CI_PROJECT_NAME /opt/catalog $AUTH_URL  --branch-name=$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME
    # publish the deposit
    - album-catalog-admin publish $CI_PROJECT_NAME /opt/catalog $AUTH_URL --branch-name=$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME
    # merge the results to main
    - album-catalog-admin merge $CI_PROJECT_NAME /opt/catalog $AUTH_URL --branch-name $CI_MERGE_REQUEST_SOURCE_BRANCH_NAME --push-option merge_request.merge_when_pipeline_succeeds --log DEBUG
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "*.db"
      when: never
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "solutions/**/*"
      when: manual

merge:
  image: bash
  stage: upload_publish
  script:
    - echo "Auto merge enabled! Success!"
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - "*.db"
      when: always

